# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release trigger plugin (reusable)

on:
  workflow_call:
    inputs:
      trigger:
        description: "Short trigger name (e.g. sqs, mqtt, cron, command)"
        required: true
        type: string
      crate:
        description: "Crate directory under crates/ (e.g. trigger-sqs)"
        required: true
        type: string
      package:
        description: "Cargo package / binary name (e.g. trigger-sqs)"
        required: true
        type: string
      rust_toolchain:
        description: "Rust toolchain version"
        required: false
        type: string
        default: "1.95"
      spin_version:
        description: "Spin CLI version to install"
        required: false
        type: string
        default: "canary"
      release_tag:
        description: "GitHub release tag to publish to (defaults to the pushed tag)"
        required: false
        type: string
        default: ""
      canary:
        description: "If true, recreate '<trigger>-canary' tag/release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.package }} (${{ matrix.config.target }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { target: "x86_64-unknown-linux-gnu",  os: "ubuntu-22.04",   arch: "amd64",   extension: "", extraArg: "--features openssl/vendored" }
          - { target: "aarch64-unknown-linux-gnu", os: "ubuntu-22.04",   arch: "aarch64", extension: "", extraArg: "--features openssl/vendored" }
          - { target: "x86_64-apple-darwin",       os: "macos-15-intel", arch: "amd64",   extension: "" }
          - { target: "aarch64-apple-darwin",      os: "macos-14",       arch: "aarch64", extension: "" }
          - { target: "x86_64-pc-windows-msvc",    os: "windows-latest", arch: "amd64",   extension: ".exe" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ matrix.config.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ inputs.package }}-${{ matrix.config.target }}-${{ hashFiles('Cargo.lock') }}"
          cache-on-failure: "true"
      - name: Install Spin
        # TODO: bump to v1 once available; see https://github.com/spinframework/actions/issues/20
        uses: spinframework/actions/spin/setup@06319d3612303cb558fabe9b13cc0d7256d0aeb9
        with:
          version: ${{ inputs.spin_version }}
          plugins: pluginify
      - name: Set up cross-compiled linux aarch64 build
        if: matrix.config.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          mkdir -p ${HOME}/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ${HOME}/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ${HOME}/.cargo/config.toml
      - name: Build plugin binary
        run: cargo build -p ${{ inputs.package }} --release --target ${{ matrix.config.target }} ${{ matrix.config.extraArg }}
      - name: Copy plugin binary to standard location
        shell: bash
        run: |
          mkdir -p target/release
          cp target/${{ matrix.config.target }}/release/${{ inputs.package }}${{ matrix.config.extension }} \
             target/release/${{ inputs.package }}${{ matrix.config.extension }}
      - name: Pluginify plugin binary
        working-directory: crates/${{ inputs.crate }}
        run: spin pluginify --arch ${{ matrix.config.arch }}
      - name: Archive pluginified
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package }}-${{ matrix.config.os }}-${{ matrix.config.arch }}
          path: |
            crates/${{ inputs.crate }}/*.tar.gz
            crates/${{ inputs.crate }}/*.json

  package:
    name: Package and publish ${{ inputs.package }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Install Spin
        # TODO: bump to v1 once available; see https://github.com/spinframework/actions/issues/20
        uses: spinframework/actions/spin/setup@06319d3612303cb558fabe9b13cc0d7256d0aeb9
        with:
          version: ${{ inputs.spin_version }}
          plugins: pluginify
      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ inputs.canary }}" = "true" ]; then
            echo "RELEASE_TAG=${{ inputs.trigger }}-canary" >> $GITHUB_ENV
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
          fi
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.package }}-*
          path: crates/${{ inputs.crate }}/artifacts
          merge-multiple: false
      - name: Display structure of downloaded files
        working-directory: crates/${{ inputs.crate }}/artifacts
        run: ls -R
      - name: Merge plugin manifest
        # `spin pluginify --merge` expects a set of sibling subdirectories,
        # each containing exactly one per-platform manifest (.json) and one
        # .tar.gz. We therefore run it from the `artifacts/` directory where
        # each downloaded artifact lives in its own subdirectory. Flattening
        # the artifacts into a single directory would cause the per-platform
        # `${{ inputs.package }}.json` files to overwrite each other.
        working-directory: crates/${{ inputs.crate }}/artifacts
        run: |
          spin pluginify --merge \
            --release-url-base https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/ \
            > ../${{ inputs.package }}.json
          cat ../${{ inputs.package }}.json

      # Canary: delete release in anticipation of recreating with new artifacts below
      - name: delete GitHub release (canary)
        if: inputs.canary == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete ${{ env.RELEASE_TAG }} --cleanup-tag

      # If the resolved release tag is anything other than <trigger>-vX.Y.Z,
      # consider it a prerelease. Note: we key off RELEASE_TAG (resolved above)
      # rather than github.ref_name, because on workflow_dispatch runs
      # github.ref_name is the branch (e.g. 'main'), not the tag.
      - name: check if pre-release
        shell: bash
        run: |
          if [[ ! "${{ env.RELEASE_TAG }}" =~ ^[a-z]+-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          then
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          fi

      - name: Extract Spin dependency version
        shell: bash
        run: |
          # Extract either 'tag = "vX.Y.Z"' or 'rev = "..."' from the first spin-app dependency.
          # `|| true` because only one of the two patterns matches, and an unmatched
          # grep would otherwise abort the step under `set -e -o pipefail`.
          SPIN_TAG=$(grep -m1 'spin-app.*tag' Cargo.toml | sed -n 's/.*tag = "\([^"]*\)".*/\1/p') || true
          SPIN_REV=$(grep -m1 'spin-app.*rev' Cargo.toml | sed -n 's/.*rev = "\([^"]*\)".*/\1/p') || true

          if [ -n "$SPIN_TAG" ]; then
            echo "SPIN_VERSION=$SPIN_TAG" >> "$GITHUB_ENV"
          elif [ -n "$SPIN_REV" ]; then
            echo "SPIN_VERSION=$SPIN_REV" >> "$GITHUB_ENV"
          else
            echo "SPIN_VERSION=unknown" >> "$GITHUB_ENV"
          fi

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ env.RELEASE_TAG }} crates/${{ inputs.crate }}/artifacts/*/*.tar.gz \
            --title ${{ env.RELEASE_TAG }} \
            --notes "Based off Spin ${{ env.SPIN_VERSION }} dependencies" \
            ${{ env.PRERELEASE }}

      # Canary builds: upload the un-shaed merged manifest produced above.
      # For tag releases, the spin-plugin-releaser step below uploads a
      # `<package>.json` with sha256s baked in, so we skip this step there
      # to avoid an "asset already exists" conflict.
      - name: Upload manifest to GitHub release (canary)
        if: inputs.canary == true
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: crates/${{ inputs.crate }}/${{ inputs.package }}.json
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      # Render the per-trigger plugin manifest (with sha256s computed from the
      # freshly-uploaded release tarballs), upload it as `<package>.json` plus a
      # `checksums-<tag>.txt` asset, and ping the spin-plugin-releaser bot to
      # open a PR against github.com/spinframework/spin-plugins.
      #
      # IMPORTANT: this action derives the plugin version and target release
      # solely from GITHUB_REF (via github.context.ref) — it ignores our
      # RELEASE_TAG env, and GITHUB_REF cannot be overridden via a step `env:`
      # (the runner protects GITHUB_* variables). When GITHUB_REF is a branch
      # (e.g. 'refs/heads/main' on a workflow_dispatch from main), the action
      # falls into its 'canary' code path and reads package.version from the
      # workspace-root Cargo.toml (no [package]) -> crash.
      #
      # Therefore this step only runs when GITHUB_REF is a real tag. That is the
      # case for tag pushes (on: push: tags) and for manual re-runs dispatched
      # against a tag ref, e.g.:
      #   gh workflow run release-command.yml --ref command-v0.7.0
      # A plain `workflow_dispatch` from main (GITHUB_REF=refs/heads/main) will
      # skip this step rather than crash. Also skipped for canary and prerelease
      # builds (the bot ignores prereleases anyway).
      - name: Open spin-plugins manifest PR
        if: inputs.canary != true && env.PRERELEASE == '' && startsWith(github.ref, 'refs/tags/')
        uses: rajatjindal/spin-plugin-releaser@v1.0.17
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          template_file: crates/${{ inputs.crate }}/.spin-plugin.json.tmpl
          upload_checksums: true
